name: CI

on:
  push:
    branches: [main]
  pull_request:

# Minimal token rights; no secrets are used anywhere in this workflow.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    # Standard (free for public repos) GitHub-hosted image with macOS 27 + Xcode 27.
    # Never use *-xlarge / larger runners here (paid).
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      # Virtualised runners have no Neural Engine; Vision would fail to compile its model.
      PAPERVEIL_OCR_CPU_ONLY: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version
      - name: Build
        run: swift build -c release
      - name: Tests (LLM tests use SIMULATED responses only)
        run: swift test
      - name: Receiver shell tests
        run: sh receiver/test-receiver.sh
      - name: Regenerate fixtures and compare annotations
        run: |
          swift run -c release pv-fixtures "$RUNNER_TEMP/fixtures"
          diff -u Fixtures/synthetic/annotations.json "$RUNNER_TEMP/fixtures/annotations.json"
      - name: OCR availability on this runner
        id: ocr
        run: |
          if swift run -c release pv-eval ocr-probe; then echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Vision-OCR läuft auf diesem Runner nicht. OCR-abhängige Tests, Qualitätsbericht und Export-Audit sind hier NICHT geprüft (lokal verifiziert, siehe docs/acceptance)."
          fi
      - name: Quality report (rules only, no LLM)
        if: steps.ocr.outputs.available == 'true'
        run: swift run -c release pv-eval report --fixtures Fixtures/synthetic --out "$RUNNER_TEMP/quality-report.md"
      - name: Export audit
        if: steps.ocr.outputs.available == 'true'
        run: swift run -c release pv-eval export-audit --fixtures Fixtures/synthetic --out "$RUNNER_TEMP/export-audit.md"
      - name: Build app bundle
        run: ./scripts/build-app.sh "$RUNNER_TEMP/dist"
      - uses: actions/upload-artifact@v7
        with:
          name: PaperVeil-unsigned-${{ github.sha }}
          path: |
            ${{ runner.temp }}/dist/PaperVeil.zip
            ${{ runner.temp }}/quality-report.md
            ${{ runner.temp }}/export-audit.md
          if-no-files-found: warn
          retention-days: 7

  receiver-linux:
    # Server-side receiver script tested on Linux as well (where it typically runs).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: sh receiver/test-receiver.sh
